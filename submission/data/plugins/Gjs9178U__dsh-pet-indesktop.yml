url: https://github.com/Gjs9178U/dsh-pet-indesktop
name: Gjs9178U/dsh-pet-indesktop
category: fun
description:
  en: 'Adds one draggable desktop pet to the DSH web GUI: a whale girl called Big Fat Fish (nickname Jingjing), with eight switchable colour skins and a personality. She eats rice, is clever but lazy, and is a tsundere: too many rapid clicks and she lies down and refuses to react for a while, calling her fat annoys her and she insists she is not, and the nickname Jingjing pleases her. After ten quiet minutes she drifts to a corner, which is visual only and never moves the position you chose. The eight PNGs are bundled with the plugin and served by the plugin itself, so there are no third-party requests. NOTE - the artwork carries an OleapCrow mark and was supplied by the repository owner, the eight skins are recolourings of that one drawing, and the plugin has not been installed against a live DSH host.'
  zh: '给 DSH 网页界面加一只可以拖动的桌宠：一只叫「大肥鱼」（昵称「鲸鲸」）的鲸鱼娘，八种配色皮肤可切换，并且有性格——只吃米饭、聪明但懒、嘴硬心软；连点几次会躺平不干了，被叫「大肥鱼」会生气并坚持自己不胖，叫「鲸鲸」才高兴；十分钟没人理会游到角落，那只改视觉、不会动你放她的位置。八张皮肤图随插件分发、由插件自己提供，因此没有任何第三方请求。注意：画面带有 OleapCrow 标记、由仓库所有者提供，八种皮肤是同一张画的重新配色；本插件尚未在真实的 DSH 宿主上安装验证过。'
